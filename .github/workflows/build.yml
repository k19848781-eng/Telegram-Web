name: Build APK
on:
  push:
    paths: ['app.zip']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build
        run: |
          unzip -o app.zip -d project
          cd project
          gradle assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../TelegramWeb.apk
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ github.run_number }}" TelegramWeb.apk --title "Telegram Web ${{ github.run_number }}" --notes "Android app"
